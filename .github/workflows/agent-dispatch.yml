name: Dispatch issue to cloud agent

# Removes the manual "Assign to Agent" click. Two ways to trigger the same
# underlying Agent Tasks API that button uses
# (https://docs.github.com/en/copilot/how-tos/use-copilot-agents/cloud-agent/use-cloud-agent-via-the-api):
#
#   1. Label an issue `agent:*`  (fires on the label event)
#   2. Comment `/agent` on an issue (fires on the comment event) — this path
#      exists so already-open issues (created before this workflow existed,
#      or any issue in general) can be dispatched without editing labels.
#
# Model conventions (same for both triggers):
#   agent:dispatch  or  /agent            -> auto model selection
#   agent:<model-slug>  or  /agent <slug> -> pin a specific model,
#     e.g. agent:claude-sonnet-4.6 / "/agent claude-sonnet-4.6"
#     Per https://docs.github.com/en/rest/agent-tasks/agent-tasks (as of
#     2026-08), supported values are: claude-sonnet-4.6, claude-opus-4.6,
#     gpt-5.2-codex, gpt-5.3-codex, gpt-5.4, claude-sonnet-4.5, claude-opus-4.5.
#     This list changes over time — if a pinned model fails, this job's
#     "Report result" comment on the issue shows the API's error; check the
#     docs page above for the current list.
#
# Requires a repo secret AGENT_TASK_PAT. This CANNOT be a classic PAT —
# per GitHub's own docs (link above), the "Start a task" endpoint only
# accepts a fine-grained personal access token (repository access limited to
# this repo, "Agent tasks" repository permission set to Read and write) or a
# GitHub App user access token. A classic PAT authenticates fine but gets a
# generic 403 {"message":"forbidden"} — cost us a couple of failed runs
# figuring that out. The token lives only in this repo's encrypted secrets —
# never pasted into chat, never touches Claude's sandbox.

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]

permissions:
  issues: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    if: >
      (github.event_name == 'issues' && startsWith(github.event.label.name, 'agent:')) ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request == null && startsWith(github.event.comment.body, '/agent'))
    steps:
      - name: Determine model + issue context
        id: ctx
        env:
          EVENT_NAME: ${{ github.event_name }}
          LABEL_NAME: ${{ github.event.label.name }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          if [ "$EVENT_NAME" = "issues" ]; then
            MODEL="${LABEL_NAME#agent:}"
            [ "$MODEL" = "dispatch" ] && MODEL=""
          else
            # "/agent" or "/agent <slug>" -> everything after the command word
            MODEL="$(echo "$COMMENT_BODY" | head -n1 | sed -E 's#^/agent[[:space:]]*##')"
          fi
          {
            echo "model=$MODEL"
            echo "issue_number=$ISSUE_NUMBER"
          } >> "$GITHUB_OUTPUT"
          {
            echo "issue_title<<EOF"
            echo "$ISSUE_TITLE"
            echo "EOF"
            echo "issue_body<<EOF"
            echo "$ISSUE_BODY"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Start cloud agent task
        id: dispatch
        env:
          GH_AGENT_PAT: ${{ secrets.AGENT_TASK_PAT }}
          ISSUE_NUMBER: ${{ steps.ctx.outputs.issue_number }}
          ISSUE_TITLE: ${{ steps.ctx.outputs.issue_title }}
          ISSUE_BODY: ${{ steps.ctx.outputs.issue_body }}
          REPO: ${{ github.repository }}
          MODEL: ${{ steps.ctx.outputs.model }}
        run: |
          # Summary written to a plain file (not $GITHUB_OUTPUT) so the
          # "Report result" step below can attach it verbatim to a comment —
          # avoids the GITHUB_OUTPUT multiline heredoc footgun (breaks if the
          # captured value contains a line matching the delimiter).
          if [ -z "$GH_AGENT_PAT" ]; then
            echo "::error::AGENT_TASK_PAT secret is not set — see comment at top of this workflow file."
            echo "AGENT_TASK_PAT secret is not set on this repo." > /tmp/dispatch_summary.txt
            exit 1
          fi

          PROMPT=$(printf '%s\n\n%s\n\nWhen done, open a PR whose description includes "Fixes #%s" so it auto-links to the issue. Read CLAUDE.md at the repo root first for project constraints before making changes.' \
            "$ISSUE_TITLE" "$ISSUE_BODY" "$ISSUE_NUMBER")

          BODY=$(jq -n \
            --arg prompt "$PROMPT" \
            --arg base "main" \
            --arg model "$MODEL" \
            '{prompt: $prompt, base_ref: $base, create_pull_request: true}
             + (if $model != "" then {model: $model} else {} end)')

          # Don't use --fail-with-body here: we want the body + status even on
          # failure so the "Report result" step below can post it where it's
          # actually readable (Action logs on this repo require a signed-in
          # GitHub session to view, which isn't always available).
          set +e
          HTTP_STATUS=$(curl -sS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Authorization: Bearer $GH_AGENT_PAT" \
            "https://api.github.com/agents/repos/$REPO/tasks" \
            -d "$BODY" \
            -o /tmp/agent_response.json \
            -w "%{http_code}")
          CURL_EXIT=$?
          set -e

          {
            echo "curl exit code: $CURL_EXIT"
            echo "HTTP status: $HTTP_STATUS"
            echo
            cat /tmp/agent_response.json 2>/dev/null || echo "(no response body captured)"
          } > /tmp/dispatch_summary.txt

          cat /tmp/dispatch_summary.txt

          if [ "$CURL_EXIT" -ne 0 ] || [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -ge 300 ]; then
            exit 1
          fi

      - name: Report result on the issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ steps.ctx.outputs.issue_number }}
          OUTCOME: ${{ steps.dispatch.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$OUTCOME" = "success" ]; then
            HEADLINE="Dispatched"
          else
            HEADLINE="Dispatch failed"
          fi
          SUMMARY_FILE=/tmp/dispatch_summary.txt
          [ -f "$SUMMARY_FILE" ] || echo "(no summary file — step may have crashed before writing one)" > "$SUMMARY_FILE"

          {
            echo "**$HEADLINE** (agent-dispatch run: $RUN_URL)"
            echo
            echo '```'
            cat "$SUMMARY_FILE"
            echo '```'
          } > /tmp/comment_body.md

          gh issue comment "$ISSUE_NUMBER" --repo "${{ github.repository }}" --body-file /tmp/comment_body.md
